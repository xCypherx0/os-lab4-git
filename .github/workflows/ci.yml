name: CI and Docker Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ShellCheck linter
        uses: ludeeus/action-shellcheck@master
      - name: Run unit test
        run: |
          output=$(./app_calculator.sh 5 10)
          test "$output" = "Сумма: 15"
  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t my-app:${{ github.sha }} .
      - name: Test Docker container
        run: |
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          for i in 1 2 3 4 5; do
            if curl --fail http://localhost:8080; then exit 0; fi
            sleep 2
          done
          exit 1
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Ansible lint
        uses: ansible/ansible-lint-action@v6
        with:
          path: ansible_iac/setup_env.yml
